name: desk_pilot_c
description: DeskPilotC - Next-generation desktop productivity environment
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.0
  tray_manager: ^0.2.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0
  url_launcher: ^6.2.0
  flutter_tts: ^3.10.0
  audioplayers: ^4.0.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  hive: ^2.2.3
  riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  flutter_gen: ^5.0.0
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.0
  build_runner: ^2.4.0
  mockito: ^5.4.0
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - img/icons/
    - img/logos/
  fonts:
    - family: Digital7
      fonts:
        - asset: assets/fonts/digital-7.regular.ttf
    - family: Stencil
      fonts:
        - asset: assets/fonts/STENCIL.TTF
    - family: Technology
      fonts:
        - asset: assets/fonts/Technology.ttf

splash:
  color: "#111827"
  image: assets/images/splash.png
